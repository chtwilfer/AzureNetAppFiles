name: Quality checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      AZUREPS_DATA_COLLECTION: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PowerShell version
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') {
              throw 'PowerShell 7.4 or newer is required.'
          }
          $PSVersionTable

      - name: Run reproducible offline quality checks
        run: ./tests/Invoke-QualityChecks.ps1 -InstallTools
